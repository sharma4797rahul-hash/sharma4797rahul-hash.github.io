
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English to Chinese Voice Translator</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f4f6fb;
    margin: 0;
    padding: 1rem;
    display: flex;
    justify-content: center;
  }

  .card {
    background: #fff;
    max-width: 600px;
    width: 100%;
    padding: 1.5rem;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
  }

  h1 { margin-top: 0; font-size: 1.4rem; }

  button {
    font-size: 1.05rem;
    padding: .8rem 1.4rem;
    border: none;
    border-radius: 999px;
    background: #3b6cf6;
    color: #fff;
    cursor: pointer;
    margin: .25rem .25rem .25rem 0;
  }

  button.listening { background: #e5484d; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  textarea {
    width: 100%;
    box-sizing: border-box;
    margin-top: 1rem;
    padding: .7rem;
    font-size: 1rem;
    border: 1px solid #ccd;
    border-radius: 10px;
  }

  .box {
    margin-top: 1rem;
    padding: 1rem;
    border-radius: 10px;
    background: #f0f2f8;
    min-height: 3rem;
  }

  .label {
    font-size: .8rem;
    color: #667;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: .3rem;
  }

  .zh { font-size: 1.6rem; }

  #status {
    margin-top: 1rem;
    color: #445;
    font-size: .95rem;
  }
</style>
</head>

<body>

<div class="card">

  <h1>English → 中文 Voice Translator</h1>

  <button id="micBtn">🎤 Start conversation</button>
  <button id="replayBtn" disabled>🔊 Replay Chinese</button>

  <textarea id="typed" rows="2"
    placeholder="Or type English here..."></textarea>

  <button id="typeBtn">Translate typed text</button>

  <div class="box">
    <div class="label">English</div>
    <div id="english">—</div>
  </div>

  <div class="box">
    <div class="label">Translation (简体中文)</div>
    <div id="chinese" class="zh">—</div>
  </div>

  <div id="status">Ready.</div>

</div>

<script>

const micBtn = document.getElementById('micBtn');
const replayBtn = document.getElementById('replayBtn');
const typeBtn = document.getElementById('typeBtn');
const typedEl = document.getElementById('typed');
const englishEl = document.getElementById('english');
const chineseEl = document.getElementById('chinese');
const statusEl = document.getElementById('status');

let lastChinese = '';

let autoMode = false;
let isRecognizing = false;
let isProcessing = false;
let isSpeaking = false;
let restartTimer = null;

function setStatus(msg) {
  statusEl.textContent = msg;
}

// ---------- Translation ----------

async function translateToChinese(text) {

  text = (text || '').trim();

  if (!text) throw new Error('No text to translate.');

  // Google translation

  try {

    const gUrl =
      'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='
      + encodeURIComponent(text);

    const gRes = await fetch(gUrl);

    if (gRes.ok) {

      const gData = await gRes.json();
      const out = gData[0].map(part => part[0]).join('');

      if (out) return out;
    }

  } catch (e) {
    // Try backup
  }

  // MyMemory backup

  const params = new URLSearchParams({
    q: text,
    langpair: 'en|zh-CN'
  });

  const res = await fetch(
    'https://api.mymemory.translated.net/get?' + params.toString()
  );

  if (!res.ok) {
    throw new Error('Network error while translating.');
  }

  const data = await res.json();

  if (data.responseStatus !== 200) {
    throw new Error(data.responseDetails || 'Translation failed.');
  }

  return data.responseData.translatedText;
}

// ---------- Automatic listening ----------

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

function startListening() {

  if (!recognition || !autoMode) return;

  if (isRecognizing || isProcessing || isSpeaking) return;

  clearTimeout(restartTimer);

  try {
    recognition.start();
  } catch (e) {
    // Avoid duplicate start attempts
  }
}

function scheduleListening() {

  clearTimeout(restartTimer);

  if (!autoMode) return;

  if (isProcessing || isSpeaking || isRecognizing) return;

  restartTimer = setTimeout(() => {

    if (
      autoMode &&
      !isProcessing &&
      !isSpeaking &&
      !isRecognizing
    ) {
      startListening();
    }

  }, 400);
}

// ---------- Chinese speech ----------

function speakChinese(text) {

  return new Promise((resolve, reject) => {

    if (!('speechSynthesis' in window)) {
      setStatus('Speech output is not supported.');
      reject(new Error('Speech output unavailable.'));
      return;
    }

    // Stop microphone before speaking

    if (recognition && isRecognizing) {
      recognition.stop();
    }

    isSpeaking = true;

    window.speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(text);

    utter.lang = 'zh-CN';

    const voices = window.speechSynthesis.getVoices();

    const zhVoice =
      voices.find(v =>
        v.lang.toLowerCase().replace('_', '-').startsWith('zh-cn')
      ) ||
      voices.find(v =>
        v.lang.toLowerCase().startsWith('zh')
      );

    if (zhVoice) {
      utter.voice = zhVoice;
    }

    utter.onend = () => {

      isSpeaking = false;

      setStatus('Chinese finished. Preparing to listen...');

      resolve();

      scheduleListening();
    };

    utter.onerror = () => {

      isSpeaking = false;

      setStatus('Chinese voice playback failed.');

      reject(new Error('Chinese voice playback failed.'));
      
      scheduleListening();
    };

    window.speechSynthesis.speak(utter);

  });
}

// ---------- Main translation flow ----------

async function handleEnglish(text) {

  text = (text || '').trim();

  if (!text) {
    setStatus('I did not catch any words.');
    return;
  }

  if (isProcessing) return;

  isProcessing = true;

  englishEl.textContent = text;

  setStatus('Translating...');

  try {

    const zh = await translateToChinese(text);

    lastChinese = zh;

    chineseEl.textContent = zh;

    replayBtn.disabled = false;

    setStatus('Speaking Chinese...');

    await speakChinese(zh);

  } catch (err) {

    setStatus('Error: ' + err.message);

  } finally {

    isProcessing = false;

    // Automatically restart microphone

    scheduleListening();

  }
}

// ---------- Speech recognition setup ----------

if (!SR) {

  micBtn.disabled = true;

  setStatus(
    'Voice input is not supported. Please use Chrome or type below.'
  );

} else {

  recognition = new SR();

  recognition.lang = 'en-US';

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;

  recognition.continuous = false;

  recognition.onstart = () => {

    isRecognizing = true;

    micBtn.classList.add('listening');

    micBtn.textContent = '🎙️ Listening...';

    setStatus('Listening. Speak English now.');

  };

  recognition.onend = () => {

    isRecognizing = false;

    micBtn.classList.remove('listening');

    micBtn.textContent = autoMode
      ? '⏹ Stop conversation'
      : '🎤 Start conversation';

    // Restart only when translation and speech are finished

    scheduleListening();

  };

  recognition.onresult = (event) => {

    const result = event.results[event.results.length - 1];

    if (result && result.isFinal) {
      handleEnglish(result[0].transcript);
    }

  };

  recognition.onerror = (e) => {

    const msgs = {
      'not-allowed':
        'Microphone blocked. Allow microphone permission.',
      'service-not-allowed':
        'Voice recognition is not allowed.',
      'no-speech':
        'No speech detected. Restarting...',
      'audio-capture':
        'No microphone found.',
      'network':
        'Network problem with voice recognition.'
    };

    setStatus(msgs[e.error] || ('Mic error: ' + e.error));

    if (
      e.error === 'not-allowed' ||
      e.error === 'service-not-allowed' ||
      e.error === 'audio-capture'
    ) {
      autoMode = false;
    }

  };

}

// ---------- Start / Stop conversation ----------

micBtn.addEventListener('click', () => {

  if (!recognition) return;

  if (autoMode) {

    // Stop continuous conversation

    autoMode = false;

    clearTimeout(restartTimer);

    window.speechSynthesis.cancel();

    isSpeaking = false;

    if (isRecognizing) {
      recognition.stop();
    }

    micBtn.textContent = '🎤 Start conversation';

    micBtn.classList.remove('listening');

    setStatus('Conversation stopped.');

  } else {

    // Start continuous conversation

    autoMode = true;

    setStatus('Starting conversation...');

    startListening();

  }

});

// ---------- Typed translation ----------

typeBtn.addEventListener('click', () => {

  handleEnglish(typedEl.value);

});

// ---------- Replay Chinese ----------

replayBtn.addEventListener('click', () => {

  if (lastChinese) {
    speakChinese(lastChinese).catch(() => {});
  }

});

// ---------- Voice loading ----------

if ('speechSynthesis' in window) {

  window.speechSynthesis.onvoiceschanged = () => {};

}

</script>

</body>
</html>
