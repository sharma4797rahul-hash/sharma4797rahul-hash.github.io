
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Valorant Translator</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap');

:root {
  --pink: #ff45b9;
  --light-pink: #ff9cde;
  --purple: #a875ff;
  --bg: #10091d;
  --panel: #1b1230;
  --white: #fff2fc;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--white);
  font-family: Poppins, sans-serif;
  background:
    radial-gradient(circle at 15% 15%, #64265c 0, transparent 35%),
    radial-gradient(circle at 85% 80%, #42236e 0, transparent 35%),
    var(--bg);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image:
    linear-gradient(#ff70ce22 1px, transparent 1px),
    linear-gradient(90deg, #ff70ce22 1px, transparent 1px);
  background-size: 38px 38px;
}

.app {
  width: min(1100px, 95%);
  margin: auto;
  padding: 28px 0 35px;
  position: relative;
  z-index: 1;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-family: Orbitron, sans-serif;
  font-size: clamp(25px, 5vw, 43px);
  font-weight: 800;
  letter-spacing: 4px;
  color: var(--pink);
  text-shadow: 0 0 15px #ff45b988;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 5px;
  color: #d7a6f5;
  margin-top: 5px;
}

.top-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 25px;
}

select, .swap {
  color: white;
  background: #241533;
  border: 1px solid var(--pink);
  border-radius: 30px;
  padding: 12px 17px;
  font: 600 13px Poppins, sans-serif;
  outline: none;
  box-shadow: 0 0 12px #ff45b933;
}

select {
  max-width: 190px;
}

select option {
  background: #241533;
}

.swap {
  width: 45px;
  height: 45px;
  padding: 0;
  font-size: 23px;
  cursor: pointer;
  transition: .3s;
}

.swap:hover {
  transform: rotate(180deg);
  background: var(--pink);
}

.translations {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.panel {
  min-height: 285px;
  border: 2px solid var(--pink);
  border-radius: 24px;
  background: linear-gradient(145deg, #291a43dd, #130d25ee);
  box-shadow: 0 0 20px #ff45b933;
  overflow: hidden;
  position: relative;
}

.panel-title {
  padding: 15px 20px;
  font-weight: 700;
  border-bottom: 1px solid #ff45b955;
  color: var(--light-pink);
  letter-spacing: 1px;
}

.output {
  padding: 25px 22px;
  font-size: 19px;
  line-height: 1.7;
  min-height: 220px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.output:empty::before {
  content: "—";
  color: #9b80b1;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 22px;
  margin: 28px 0 20px;
}

.circle {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 2px solid var(--pink);
  background: radial-gradient(circle, #48204e, #1a102c);
  color: white;
  font-size: 25px;
  cursor: pointer;
  box-shadow: 0 0 15px #ff45b955;
  transition: .25s;
  position: relative;
}

.circle:hover {
  transform: translateY(-5px) scale(1.06);
  background: var(--pink);
  box-shadow: 0 0 25px var(--pink);
}

.circle.active {
  background: var(--pink);
  animation: pulse 1.4s infinite;
}

.mic {
  width: 105px;
  height: 105px;
  font-size: 38px;
  border-width: 3px;
  background: radial-gradient(circle, #ff72d0, #8d2ab7);
  box-shadow: 0 0 30px #ff45b9aa;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 12px var(--pink); }
  50% { box-shadow: 0 0 35px var(--pink); }
}

.button-label {
  text-align: center;
  font-size: 11px;
  margin-top: 7px;
  color: #e7c6fa;
}

.status {
  text-align: center;
  color: #ff9cde;
  font-size: 12px;
  min-height: 20px;
  margin-top: 15px;
}

.cat {
  position: fixed;
  font-size: 36px;
  z-index: 0;
  pointer-events: none;
  animation: walk 18s linear infinite;
  filter: drop-shadow(0 0 8px #ff72d0);
}

.cat.one {
  bottom: 8px;
  left: -60px;
}

.cat.two {
  top: 16%;
  right: -60px;
  animation-delay: -9s;
}

@keyframes walk {
  0% { transform: translateX(0) translateY(0); }
  25% { transform: translateX(25vw) translateY(-8px); }
  50% { transform: translateX(50vw) translateY(0); }
  75% { transform: translateX(75vw) translateY(-8px); }
  100% { transform: translateX(110vw) translateY(0); }
}

.petal {
  position: fixed;
  top: -30px;
  color: #ff79cf;
  pointer-events: none;
  animation: fall 9s linear infinite;
  opacity: .7;
  z-index: 0;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(600deg);
  }
}

@media(max-width: 650px) {
  .app { padding-top: 20px; }
  .translations {
    grid-template-columns: 1fr;
    gap: 15px;
  }
  .panel { min-height: 210px; }
  .output { min-height: 145px; font-size: 17px; }
  .circle { width: 62px; height: 62px; font-size: 21px; }
  .mic { width: 85px; height: 85px; font-size: 32px; }
  .controls { gap: 16px; }
  .subtitle { letter-spacing: 3px; }
}
</style>
</head>

<body>

<div class="cat one">🐈</div>
<div class="cat two">🐈‍⬛</div>

<div class="app">

<header>
  <div class="logo">VALORANT</div>
  <div class="subtitle">VOICE TRANSLATOR</div>
</header>

<div class="top-controls">

  <select id="sourceLang" aria-label="Speaking language">
    <option value="en-US">🇬🇧 English</option>
    <option value="zh-CN">🇨🇳 Chinese</option>
  </select>

  <button class="swap" id="swapBtn" title="Swap languages">⇄</button>

  <select id="targetLang" aria-label="Translation language">
    <option value="zh-CN">🇨🇳 Chinese</option>
    <option value="en-US">🇬🇧 English</option>
  </select>

  <select id="voiceSelect" aria-label="Agent voice">
    <option value="">Agent Voice</option>
  </select>

</div>

<div class="translations">

  <section class="panel">
    <div class="panel-title" id="sourceTitle">🎙 ENGLISH</div>
    <div class="output" id="sourceOutput"></div>
  </section>

  <section class="panel">
    <div class="panel-title" id="targetTitle">✦ CHINESE</div>
    <div class="output" id="targetOutput"></div>
  </section>

</div>

<div class="controls">

  <div>
    <button class="circle" id="startBtn" title="Start conversation">▶</button>
    <div class="button-label">START</div>
  </div>

  <div>
    <button class="circle" id="micBtn" title="Start listening">🎙</button>
    <div class="button-label">MIC</div>
  </div>

  <div>
    <button class="circle" id="stopBtn" title="Stop conversation">■</button>
    <div class="button-label">STOP</div>
  </div>

  <div>
    <button class="circle" id="replayBtn" title="Replay translation">↻</button>
    <div class="button-label">REPLAY</div>
  </div>

</div>

<div class="status" id="status">READY</div>

</div>

<script>
const sourceLang = document.getElementById("sourceLang");
const targetLang = document.getElementById("targetLang");
const voiceSelect = document.getElementById("voiceSelect");

const sourceOutput = document.getElementById("sourceOutput");
const targetOutput = document.getElementById("targetOutput");
const sourceTitle = document.getElementById("sourceTitle");
const targetTitle = document.getElementById("targetTitle");
const statusText = document.getElementById("status");

const startBtn = document.getElementById("startBtn");
const micBtn = document.getElementById("micBtn");
const stopBtn = document.getElementById("stopBtn");
const replayBtn = document.getElementById("replayBtn");
const swapBtn = document.getElementById("swapBtn");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition = null;
let autoMode = false;
let listening = false;
let processing = false;
let speaking = false;
let restartTimer = null;
let lastTranslation = "";
let voices = [];
let sessionId = 0;

function sourceName() {
  return sourceLang.value === "en-US" ? "ENGLISH" : "CHINESE";
}

function targetName() {
  return targetLang.value === "en-US" ? "ENGLISH" : "CHINESE";
}

function updateLabels() {
  sourceTitle.textContent = "🎙 " + sourceName();
  targetTitle.textContent = "✦ " + targetName();
  loadVoices();
}

function setStatus(message) {
  statusText.textContent = message;
}

swapBtn.addEventListener("click", () => {
  const oldSource = sourceLang.value;
  sourceLang.value = targetLang.value;
  targetLang.value = oldSource;
  updateLabels();

  if (autoMode) {
    stopConversation();
    startConversation();
  }
});

sourceLang.addEventListener("change", () => {
  if (sourceLang.value === targetLang.value) {
    targetLang.value = sourceLang.value === "en-US" ? "zh-CN" : "en-US";
  }
  updateLabels();
});

targetLang.addEventListener("change", () => {
  if (sourceLang.value === targetLang.value) {
    sourceLang.value = targetLang.value === "en-US" ? "zh-CN" : "en-US";
  }
  updateLabels();
});

function loadVoices() {
  if (!("speechSynthesis" in window)) return;

  voices = speechSynthesis.getVoices();
  const language = targetLang.value.split("-")[0];

  const matching = voices.filter(v =>
    v.lang.toLowerCase().startsWith(language.toLowerCase())
  );

  voiceSelect.innerHTML = "";

  const automatic = document.createElement("option");
  automatic.value = "";
  automatic.textContent = "Agent Voice · Auto";
  voiceSelect.appendChild(automatic);

  matching.forEach((voice, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = voice.name;
    voiceSelect.appendChild(option);
  });
}

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function getSelectedVoice() {
  const language = targetLang.value.split("-")[0];
  const matching = voices.filter(v =>
    v.lang.toLowerCase().startsWith(language.toLowerCase())
  );

  if (voiceSelect.value !== "") {
    return matching[Number(voiceSelect.value)] || null;
  }

  return matching[0] || null;
}

function createRecognition() {
  if (!SpeechRecognition) {
    setStatus("SPEECH RECOGNITION NOT SUPPORTED");
    return null;
  }

  const rec = new SpeechRecognition();
  rec.lang = sourceLang.value;
  rec.continuous = false;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    listening = true;
    micBtn.classList.add("active");
    setStatus("LISTENING...");
  };

  rec.onresult = async (event) => {
    let finalText = "";
    let interimText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalText += text;
      } else {
        interimText += text;
      }
    }

    if (interimText) {
      sourceOutput.textContent = interimText;
    }

    if (finalText.trim()) {
      sourceOutput.textContent = finalText.trim();
      await translateText(finalText.trim());
    }
  };

  rec.onerror = (event) => {
    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      autoMode = false;
      setStatus("MICROPHONE PERMISSION REQUIRED");
    } else if (event.error !== "no-speech" &&
               event.error !== "aborted") {
      setStatus("MICROPHONE ERROR");
    }
  };

  rec.onend = () => {
    listening = false;
    micBtn.classList.remove("active");

    if (autoMode && !processing && !speaking) {
      scheduleRestart();
    }
  };

  return rec;
}

function startListening() {
  if (!autoMode || listening || processing || speaking) return;

  clearTimeout(restartTimer);

  try {
    recognition = createRecognition();
    if (recognition) recognition.start();
  } catch (error) {
    scheduleRestart();
  }
}

function scheduleRestart() {
  clearTimeout(restartTimer);

  if (!autoMode) return;

  restartTimer = setTimeout(() => {
    if (autoMode && !listening && !processing && !speaking) {
      startListening();
    }
  }, 700);
}

async function translateText(text) {
  if (processing) return;

  processing = true;
  const currentSession = sessionId;
  setStatus("TRANSLATING...");

  try {
    const from = sourceLang.value.startsWith("en") ? "en" : "zh-CN";
    const to = targetLang.value.startsWith("en") ? "en" : "zh-CN";

    let translated = "";

    try {
      const url =
        "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" +
        encodeURIComponent(from) +
        "&tl=" + encodeURIComponent(to) +
        "&dt=t&q=" + encodeURIComponent(text);

      const response = await fetch(url);
      if (!response.ok) throw new Error("Translation failed");

      const data = await response.json();
      translated = data[0].map(item => item[0] || "").join("");
    } catch (error) {
      const backup =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(text) +
        "&langpair=" + encodeURIComponent(from + "|" + to);

      const response = await fetch(backup);
      const data = await response.json();

      if (data.responseStatus !== 200) {
        throw new Error("No translation available");
      }

      translated = data.responseData.translatedText;
    }

    if (currentSession !== sessionId) return;

    lastTranslation = translated;
    targetOutput.textContent = translated;
    speakTranslation(translated);

  } catch (error) {
    if (currentSession === sessionId) {
      setStatus("TRANSLATION FAILED");
    }
  } finally {
    processing = false;

    if (autoMode && !speaking) {
      scheduleRestart();
    }
  }
}

function speakTranslation(text) {
  if (!("speechSynthesis" in window) || !text) {
    setStatus("TRANSLATION COMPLETE");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = targetLang.value;

  const selectedVoice = getSelectedVoice();
  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }

  utterance.rate = 1;
  utterance.pitch = 1;

  speaking = true;
  setStatus("PLAYING TRANSLATION...");

  utterance.onend = () => {
    speaking = false;
    setStatus(autoMode ? "LISTENING..." : "READY");
    if (autoMode) scheduleRestart();
  };

  utterance.onerror = () => {
    speaking = false;
    if (autoMode) scheduleRestart();
  };

  speechSynthesis.speak(utterance);
}

function startConversation() {
  if (!SpeechRecognition) {
    setStatus("USE CHROME FOR VOICE SUPPORT");
    return;
  }

  autoMode = true;
  sessionId++;
  setStatus("STARTING...");
  startListening();
}

function stopConversation() {
  autoMode = false;
  sessionId++;
  clearTimeout(restartTimer);

  if (recognition) {
    try {
      recognition.abort();
    } catch (error) {}
  }

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  listening = false;
  processing = false;
  speaking = false;

  micBtn.classList.remove("active");
  setStatus("STOPPED");
}

startBtn.addEventListener("click", startConversation);
stopBtn.addEventListener("click", stopConversation);

micBtn.addEventListener("click", () => {
  if (autoMode) {
    stopConversation();
  } else {
    startConversation();
  }
});

replayBtn.addEventListener("click", () => {
  if (lastTranslation) {
    speakTranslation(lastTranslation);
  } else {
    setStatus("NO TRANSLATION TO REPLAY");
  }
});

function createPetals() {
  for (let i = 0; i < 14; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.textContent = "✿";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDelay = Math.random() * 9 + "s";
    petal.style.fontSize = (10 + Math.random() * 15) + "px";
    document.body.appendChild(petal);
  }
}

createPetals();
updateLabels();
</script>

</body>
</html>
