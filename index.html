<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English to Chinese Voice Translator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6fb; margin: 0; padding: 1rem; display: flex; justify-content: center; }
  .card { background: #fff; max-width: 600px; width: 100%; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { margin-top: 0; font-size: 1.4rem; }
  button { font-size: 1.05rem; padding: .8rem 1.4rem; border: none; border-radius: 999px; background: #3b6cf6; color: #fff; cursor: pointer; margin: .25rem .25rem .25rem 0; }
  button.listening { background: #e5484d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  textarea { width: 100%; box-sizing: border-box; margin-top: 1rem; padding: .7rem; font-size: 1rem; border: 1px solid #ccd; border-radius: 10px; }
  .box { margin-top: 1rem; padding: 1rem; border-radius: 10px; background: #f0f2f8; min-height: 3rem; }
  .label { font-size: .8rem; color: #667; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .3rem; }
  .zh { font-size: 1.6rem; }
  #status { margin-top: 1rem; color: #445; font-size: .95rem; }
</style>
</head>
<body>
<div class="card">
  <h1>English → 中文 Voice Translator</h1>

  <button id="micBtn">🎤 Start speaking</button>
  <button id="replayBtn" disabled>🔊 Replay Chinese</button>

  <textarea id="typed" rows="2" placeholder="Or type English here..."></textarea>
  <button id="typeBtn">Translate typed text</button>

  <div class="box">
    <div class="label">English</div>
    <div id="english">—</div>
  </div>
  <div class="box">
    <div class="label">Translation (简体中文)</div>
    <div id="chinese" class="zh">—</div>
  </div>
  <div id="status">Ready.</div>
</div>

<script>
const micBtn = document.getElementById('micBtn');
const replayBtn = document.getElementById('replayBtn');
const typeBtn = document.getElementById('typeBtn');
const typedEl = document.getElementById('typed');
const englishEl = document.getElementById('english');
const chineseEl = document.getElementById('chinese');
const statusEl = document.getElementById('status');

let lastChinese = '';

function setStatus(msg) { statusEl.textContent = msg; }

// ---------- Translation ----------
async function translateToChinese(text) {
  text = (text || '').trim();
  if (!text) throw new Error('No text to translate.');

  // 1) Google's free endpoint
  try {
    const gUrl = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + encodeURIComponent(text);
    const gRes = await fetch(gUrl);
    if (gRes.ok) {
      const gData = await gRes.json();
      const out = gData[0].map(part => part[0]).join('');
      if (out) return out;
    }
  } catch (e) { /* try the backup */ }

  // 2) Backup: MyMemory
  const params = new URLSearchParams({ q: text, langpair: 'en|zh-CN' });
  const res = await fetch('https://api.mymemory.translated.net/get?' + params.toString());
  if (!res.ok) throw new Error('Network error while translating.');
  const data = await res.json();
  if (data.responseStatus !== 200) throw new Error(data.responseDetails || 'Translation failed.');
  return data.responseData.translatedText;
}

// ---------- Speaking Chinese ----------
function speakChinese(text) {
  if (!('speechSynthesis' in window)) {
    setStatus('This browser cannot speak aloud.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang.toLowerCase().replace('_','-').startsWith('zh-cn')) ||
                  voices.find(v => v.lang.toLowerCase().startsWith('zh'));
  if (zhVoice) utter.voice = zhVoice
  utter.onend = () => startListening.();
  utter.onerror = () => setStatus('Could not play Chinese voice. Check that a Chinese voice is installed in your phone settings.');
  window.speechSynthesis.speak(utter);
}

// ---------- Main flow ----------
async function handleEnglish(text) {
  text = (text || '').trim();
  if (!text) { setStatus('I did not catch any words. Please try again.'); return; }
  englishEl.textContent = text;
  setStatus('Translating...');
  try {
    const zh = await translateToChinese(text);
    lastChinese = zh;
    chineseEl.textContent = zh;
    replayBtn.disabled = false;
    setStatus('Speaking Chinese...');
    speakChinese(zh);
  } catch (err) {
    setStatus('Translation failed: ' + err.message);
  }
}

// ---------- Speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (!SR) {
  micBtn.disabled = true;
  setStatus('Voice input is not supported here. Open this page in Chrome, or type below.');
} else {
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    micBtn.classList.add('listening');
    micBtn.textContent = '🎙️ Listening...';
    setStatus('Listening - speak English now.');
  };
  recognition.onend = () => {
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤 Start speaking';
  };
  recognition.onerror = (e) => {
    const msgs = {
      'not-allowed': 'Microphone is blocked. Allow the mic for this site, or use the text box.',
      'service-not-allowed': 'Microphone is blocked here. Open the page in Chrome, or use the text box.',
      'no-speech': 'I heard nothing. Tap the button and try again.',
      'audio-capture': 'No microphone found.',
      'network': 'Network problem with voice recognition.'
    };
    setStatus(msgs[e.error] || ('Mic error: ' + e.error));
  };
  recognition.onresult = (event) => {
    handleEnglish(event.results[0][0].transcript);
  };
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;
  window.speechSynthesis.cancel();
  try { recognition.start(); } catch (e) { setStatus('Already listening - speak now.'); }
});

typeBtn.addEventListener('click', () => handleEnglish(typedEl.value));

replayBtn.addEventListener('click', () => { if (lastChinese) speakChinese(lastChinese); });

if ('speechSynthesis' in window) { window.speechSynthesis.onvoiceschanged = () => {}; }
</script>
</body>
</html>
